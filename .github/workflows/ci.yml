name: CI

on:
  push:
  pull_request:
  schedule:
  - cron: "0 7,16 * * *"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm audit --audit-level=high

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - name: Run audit-ci security scan
        run: npm run audit:ci
      - name: Run tokenless AuditJS report
        continue-on-error: true
        run: npm run audit:auditjs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v3

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: docker://zricethezav/gitleaks:latest
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source=/github/workspace --redact --exit-code 1

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test

  register-mock-integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:bdd:install
      - run: npm run test:bdd:register:mock
      
  coverage:
    needs:
      - test
      - register-mock-integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:coverage

  owasp-zap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - run: npm ci
      - run: npm run build

      - name: Start compiled frontend
        run: |
          set -euo pipefail
          node -e 'require("http").createServer((_request, response) => { response.writeHead(200, { "Content-Type": "application/json" }); response.end("[]"); }).listen(4000)' > backend-stub.log 2>&1 &
          echo "$!" > backend-stub.pid
          API_BASE_URL=http://127.0.0.1:4000 NODE_ENV=production PORT=3000 \
            node dist/index.js > app.log 2>&1 &
          echo "$!" > app.pid

      - name: Wait for frontend health endpoint
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          set -euo pipefail
          ZAP_REPORT_DIR="$RUNNER_TEMP/zap"
          mkdir -p "$ZAP_REPORT_DIR"
          chmod 777 "$ZAP_REPORT_DIR"
          docker run --rm --network host \
            -v "$ZAP_REPORT_DIR:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py \
            -t http://127.0.0.1:3000/health \
            -r zap-report.html \
            -J zap-report.json \
            -x zap-report.xml \
            -I

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-zap-reports
          path: |
            ${{ runner.temp }}/zap/zap-report.html
            ${{ runner.temp }}/zap/zap-report.json
            ${{ runner.temp }}/zap/zap-report.xml
            app.log
            backend-stub.log
          if-no-files-found: warn

      - name: Stop compiled frontend
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
          if [ -f backend-stub.pid ]; then
            kill "$(cat backend-stub.pid)" 2>/dev/null || true
          fi

  sonarqube-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

      - name: Raise vm.max_map_count for SonarQube's Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start SonarQube Community Edition
        run: docker run -d --name sonarqube -p 9000:9000 sonarqube:community

      - name: Wait for SonarQube to become healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status=$(curl --silent -u admin:admin http://127.0.0.1:9000/api/system/health | grep -o '"health":"[A-Z]*"' || true)
            if [ "$status" = '"health":"GREEN"' ]; then
              exit 0
            fi
            sleep 5
          done
          docker logs sonarqube || true
          exit 1

      - name: Generate a scan token
        run: |
          set -euo pipefail
          token=$(curl --silent -u admin:admin -X POST "http://127.0.0.1:9000/api/user_tokens/generate?name=ci-scan-${GITHUB_RUN_ID}" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run SonarQube scan
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: http://127.0.0.1:9000
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Fetch issue report
        if: always()
        run: |
          curl --silent -u admin:admin \
            "http://127.0.0.1:9000/api/issues/search?componentKeys=team4-frontend" \
            -o sonar-issues.json || true

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sonarqube-report
          path: sonar-issues.json
          if-no-files-found: warn

      - name: Stop SonarQube
        if: always()
        run: |
          docker stop sonarqube || true
          docker rm sonarqube || true

  docker-image-build-verify:
    needs:
      - dependency-audit
      - security-scan
      - codeql
      - gitleaks-scan
      - coverage
    runs-on: ubuntu-latest
    env:
      ACR_NAME: acraiacademy26
    steps:
      - uses: actions/checkout@v5

      - name: Create tags
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA::8}
          TS=$(date +'%Y-%m-%d-%H-%M-%S')
          IMAGE_REPO="team4-frontend"

          echo "PROD_TAG=${IMAGE_REPO}:${SHORT_SHA}-prod-deps-${TS}" >> "$GITHUB_ENV"
          echo "LATEST_PROD_TAG=${IMAGE_REPO}:latest-prod-deps" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: |
          set -euo pipefail
          docker build -t "$PROD_TAG" .
          docker tag "$PROD_TAG" "$LATEST_PROD_TAG"

      - name: Verify build tags
        run: |
          set -euo pipefail
          docker image inspect "$PROD_TAG" > /dev/null
          docker image inspect "$LATEST_PROD_TAG" > /dev/null
          echo "Docker images built successfully: $PROD_TAG, $LATEST_PROD_TAG"

      - name: Smoke test container startup and health endpoint
        run: |
          set -euo pipefail
          docker run -d --name team4-frontend-smoke -p 3000:3000 \
            -e API_BASE_URL='http://127.0.0.1:3000' \
            "$PROD_TAG"
          trap 'docker logs team4-frontend-smoke || true; docker rm -f team4-frontend-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "Container is healthy"
              exit 0
            fi

            if ! docker ps --filter "name=team4-frontend-smoke" --filter "status=running" --format '{{.Names}}' | grep -q '^team4-frontend-smoke$'; then
              echo "Container stopped before becoming healthy"
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out"
          exit 1

      - name: Validate Azure credentials and ACR reachability
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"
          az acr show --name "$ACR_NAME" --query loginServer --output tsv

      - name: Azure login as service principal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" \
            --tenant "$TENANT_ID"

      - name: Log in to Azure ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "$ACR_NAME"

      - name: Push verified images to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          ACR_REPOSITORY="${PROD_TAG%%:*}"
          ACR_PROD_TAG="${ACR_LOGIN_SERVER}/${ACR_REPOSITORY}:${PROD_TAG#*:}"

          docker tag "$PROD_TAG" "$ACR_PROD_TAG"

          docker push "$ACR_PROD_TAG"
