name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm audit --audit-level=high

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate existing Terraform directories
        run: |
          set -euo pipefail
          found_dir="false"

          for dir in my-infrastructure modules/resource-group; do
            if [[ -d "$dir" ]]; then
              found_dir="true"
              echo "Validating Terraform in $dir"
              terraform -chdir="$dir" fmt -check -recursive
              terraform -chdir="$dir" init -backend=false
              terraform -chdir="$dir" validate
            else
              echo "Skipping missing Terraform directory: $dir"
            fi
          done

          if [[ "$found_dir" == "false" ]]; then
            echo "No Terraform directories found, skipping Terraform validation."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v3

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test

  register-mock-integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:bdd:install
      - run: npm run test:bdd:register:mock
      
  coverage:
    needs:
      - test
      - register-mock-integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:coverage

  docker-image-build-verify:
    needs:
      - dependency-audit
      - terraform-validate
      - codeql
      - coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-target:
          - include-dev-deps: "false"
            tag-suffix: "prod-deps"
          - include-dev-deps: "true"
            tag-suffix: "dev-deps"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            INCLUDE_DEV_DEPS=${{ matrix.build-target.include-dev-deps }}
          tags: team4-frontend:ci-${{ matrix.build-target.tag-suffix }}
