name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 16 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm audit --audit-level=high

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate existing Terraform directories
        run: |
          set -euo pipefail
          found_dir="false"

          for dir in my-infrastructure modules/resource-group; do
            if [[ -d "$dir" ]]; then
              found_dir="true"
              echo "Validating Terraform in $dir"
              terraform -chdir="$dir" fmt -check -recursive
              terraform -chdir="$dir" init -backend=false
              terraform -chdir="$dir" validate
            else
              echo "Skipping missing Terraform directory: $dir"
            fi
          done

          if [[ "$found_dir" == "false" ]]; then
            echo "No Terraform directories found, skipping Terraform validation."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@v3

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test

  register-mock-integration-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:bdd:install
      - run: npm run test:bdd:register:mock
      
  coverage:
    needs:
      - test
      - register-mock-integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run test:coverage

  docker-image-build-verify:
    needs:
      - dependency-audit
      - terraform-validate
      - codeql
      - coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tags
        run: |
          set -euo pipefail
          SHORT_SHA=${GITHUB_SHA::8}
          TS=$(date +'%Y-%m-%d-%H-%M-%S')
          IMAGE_REPO="team4-frontend"

          echo "PROD_TAG=${IMAGE_REPO}:${SHORT_SHA}-${TS}-prod-deps" >> "$GITHUB_ENV"
          echo "DEV_TAG=${IMAGE_REPO}:${SHORT_SHA}-${TS}-dev-deps" >> "$GITHUB_ENV"
          echo "LATEST_PROD_TAG=${IMAGE_REPO}:latest-prod-deps" >> "$GITHUB_ENV"
          echo "LATEST_DEV_TAG=${IMAGE_REPO}:latest-dev-deps" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: |
          set -euo pipefail
          docker build --build-arg INCLUDE_DEV_DEPS=false -t "$PROD_TAG" .
          docker tag "$PROD_TAG" "$LATEST_PROD_TAG"

          docker build --build-arg INCLUDE_DEV_DEPS=true -t "$DEV_TAG" .
          docker tag "$DEV_TAG" "$LATEST_DEV_TAG"

      - name: Verify build tags
        run: |
          set -euo pipefail
          docker image inspect "$PROD_TAG" > /dev/null
          docker image inspect "$LATEST_PROD_TAG" > /dev/null
          docker image inspect "$DEV_TAG" > /dev/null
          docker image inspect "$LATEST_DEV_TAG" > /dev/null
          echo "Docker images built successfully: $PROD_TAG, $LATEST_PROD_TAG, $DEV_TAG, $LATEST_DEV_TAG"

      - name: Smoke test container startup and health endpoint
        run: |
          set -euo pipefail
          docker run -d --name team4-frontend-smoke -p 3000:3000 \
            -e API_BASE_URL='http://127.0.0.1:3000' \
            "$PROD_TAG"
          trap 'docker logs team4-frontend-smoke || true; docker rm -f team4-frontend-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then
              echo "Container is healthy"
              exit 0
            fi

            if ! docker ps --filter "name=team4-frontend-smoke" --filter "status=running" --format '{{.Names}}' | grep -q '^team4-frontend-smoke$'; then
              echo "Container stopped before becoming healthy"
              exit 1
            fi

            sleep 2
          done

          echo "Health check timed out"
          exit 1
